name: F1M Engine - test and mobile preview
on:
  push:
    branches: [develop/f1m-engine-1.0]
  workflow_dispatch:
  pull_request:
    branches: [develop/f1m-engine-1.0]
permissions:
  contents: read
concurrency:
  group: f1m-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:pwa
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f1m-test-reports
          path: |
            reports/
            test-results/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  physical-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:race
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f1m-race-evidence
          path: evidence/
  deploy:
    if: github.event_name != 'pull_request'
    needs: [test-build, physical-drive]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
